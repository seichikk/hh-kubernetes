apiVersion: batch/v1
kind: Job
metadata:
  name: pairs-split
  namespace: hh
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: split
          image: hh-k8s:1
          args: ["split", "--parts", "12"]
          envFrom:
            - configMapRef:
                name: s3
            - secretRef:
                name: s3-keys
          resources:
            requests:
              cpu: "1"
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 256Mi
